server:
  port: 9016
spring:
  application:
    name: springboot-delayed-message-queue
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true # 处理404
  web:
    resources:
      add-mappings: false # 关闭资源映射
  webflux:
    base-path: /


logging:
  config: classpath:logback-spring.xml