spring:
  application:
    name: springboot-distributed-lock-redis
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true # 处理404
  web:
    resources:
      add-mappings: false # 关闭资源映射

server:
  port: 9009
  servlet:
    context-path: /

logging:
  config: classpath:logback-spring.xml
  level:
    cn.z201.example.distributed.redis: DEBUG
