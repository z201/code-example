version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.7.1
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
      - "8080:8080"
    environment:
      - ZOO_MY_ID=1
      - JVMFLAGS=-Djava.security.auth.login.config=/conf/jaas.conf
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - ./docker-config/zookeeper/zoo.cfg:/conf/zoo.cfg:ro
      - ./docker-config/zookeeper/jaas.conf:/conf/jaas.conf:ro
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - zookeeper_net

networks:
  zookeeper_net:
    driver: bridge

volumes:
  zookeeper_data:
    driver: local
  zookeeper_datalog:
    driver: local